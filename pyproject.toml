[project]
name = "a2n-learn"
version = "0.1.0"
description = "Lingkungan belajar a2n.Learn untuk modul 1 sampai 8, dengan numpy, pandas, dan scikit-learn. Modul 8 juga memakai onnxruntime dan skl2onnx."
requires-python = "==3.14.*"
dependencies = [
  "ipykernel",
  "jupyterlab",
  "nbmake",
  "numpy",
  "onnxruntime>=1.31.1",
  "pandas",
  "pytest",
  "scikit-learn",
  "skl2onnx>=1.20.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
  "phase1-ml/modul-01-persiapan",
  "phase1-ml/modul-02-cara-berpikir-ml",
  "phase1-ml/modul-03-regresi",
  # Tes modul 3b ada di phase1-ml/modul-03b-regularisasi/tests dan ikut folder induk, jadi jalur itu tidak diulang.
  "phase1-ml/modul-03b-regularisasi",
  "phase1-ml/modul-04a-klasifikasi",
  "phase1-ml/modul-04b-pohon-gabungan",
  "phase1-ml/modul-05a-validasi-overfitting",
  "phase1-ml/modul-05b-metrik-penilaian",
  "phase1-ml/modul-06a-rekayasa-fitur",
  "phase1-ml/modul-06b-pipeline",
  "phase1-ml/modul-07-tanpa-label",
  "phase1-ml/modul-08-proyek-akhir",
]
python_files = ["test_*.py"]
