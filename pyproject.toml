[project]
name = "a2n-learn"
version = "0.1.0"
description = "Lingkungan belajar a2n.Learn. Modul 1 memakai numpy, pandas, dan scikit-learn. Modul 8 menambah skl2onnx dan onnxruntime."
requires-python = "==3.14.*"
dependencies = [
  "ipykernel",
  "jupyterlab",
  "nbmake",
  "numpy",
  "onnxruntime>=1.31.1",
  "pandas",
  "pytest",
  "scikit-learn",
  "skl2onnx>=1.20.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
  "phase1-ml/modul-01-persiapan",
  "phase1-ml/modul-02-cara-berpikir-ml",
  "phase1-ml/modul-08-proyek-akhir",
]
python_files = ["test_*.py"]
