[project]
name = "modul-02-cara-berpikir-ml"
version = "0.1.0"
description = "Modul 2: data latih dan data uji, baseline, dan rata-rata selisih mutlak"
requires-python = ">=3.14,<3.15"
dependencies = [
  "ipykernel",
  "jupyterlab",
  "nbmake",
  "numpy",
  "pandas",
  "pytest",
  "scikit-learn",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
